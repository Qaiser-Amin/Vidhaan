[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidhaan"
version = "0.1.0"
description = "Local evidence-first Indian legal research prototype"
authors = [{name = "Qaiser Amin Ganaie"}]
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.143.0", "uvicorn==0.54.0", "python-multipart==0.0.32", "pypdf==6.0.0", "rank-bm25==0.2.2",
  "httpx==0.28.1", "pydantic==2.11.7", "numpy==2.2.6", "python-dotenv==1.1.1"
]

[project.optional-dependencies]
embeddings = ["sentence-transformers==5.1.0", "torch==2.8.0+cpu; sys_platform != 'darwin'", "torch==2.8.0; sys_platform == 'darwin'"]
faiss = ["faiss-cpu==1.12.0"]
dev = ["pytest==8.4.2", "psutil==7.0.0", "reportlab==4.4.4"]
reranking = ["sentence-transformers==5.1.0", "torch==2.8.0+cpu; sys_platform != 'darwin'", "torch==2.8.0; sys_platform == 'darwin'"]

[project.scripts]
vidhaan = "vidhaan.cli:main"

[tool.setuptools.packages.find]
include = ["vidhaan*"]
namespaces = false

[tool.setuptools.package-data]
vidhaan = ["web/index.html", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
